<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="一站式效率工具平台，涵盖图片处理、文档转换、开发工具等实用功能" />
    <meta name="keywords" content="在线工具,效率工具,图片处理,文档转换,Base64,JSON格式化,Markdown编辑器,密码生成" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:">
    <title>一站式效率工具平台</title>
  </head>
  <body>
    <script>
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          var path = redirect.replace(location.origin + '/vue3-tools', '') || '/';
          history.replaceState(null, null, path);
        }
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
